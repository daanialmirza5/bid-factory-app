version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidfactory_app
    ports:
      - "8000:8000"
    environment:
      - ROCKETRIDE_URI=${ROCKETRIDE_URI:-https://staging.rocketride.ai}
      - ROCKETRIDE_APIKEY=${ROCKETRIDE_APIKEY:-}
      - ROCKETRIDE_GROQ_KEY=${ROCKETRIDE_GROQ_KEY:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5.12.0
    container_name: bidfactory_neo4j
    ports:
      - "7474:7474" # Browser interface
      - "7687:7687" # Bolt protocol for Python connection
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
